# Copy into the app's Secrets (Streamlit Community Cloud → your app → ⋮ → Settings → Secrets),
# or into .streamlit/secrets.toml when running on your own computer. NEVER commit real values to GitHub.
#
# Generate random values in Terminal with:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"

[research]
enabled = true                         # turn on ONLY after IRB approval
study_title = "Learning quality management with interactive simulations"
irb_protocol = "IRB-2027-000"          # shown to students on the consent screen
institution = "Your university"
pi_name = "Your name"
pi_email = "you@university.edu"
irb_contact = "the university IRB office, irb@university.edu"   # optional
course_code = "POM445-SP27-01"         # tags every event; use a new code for each section and semester

backend = "webhook"                    # "webhook" (Google Sheet via Apps Script) or "local" (own computer only)
webhook_url = "https://script.google.com/macros/s/XXXXXXXX/exec"
webhook_token = "PASTE-THE-SAME-TOKEN-AS-IN-THE-APPS-SCRIPT"
# local_path = "research_data/events.jsonl"   # only for backend = "local"

salt = "PASTE-A-LONG-RANDOM-STRING"    # scrambles participant codes; keep it secret and never change it mid-study
conditions = ["predict", "no_predict"] # optional experiment; remove the line for a single-condition study
instructor_password = "CHOOSE-A-PASSWORD"   # unlocks collected data on the Instructor dashboard

# Optional: replace the default sentence about who sees the data and when (must match your IRB protocol)
# data_access_note = "..."
